<script>
const video=document.getElementById('video'),status=document.getElementById('status');
fetch('media/logireflow-walkthrough-chapters.json').then(r=>{if(!r.ok)throw Error('章节尚未就绪');return r.json()}).then(items=>{for(const c of items){const b=document.createElement('button');b.textContent=String(Math.floor(c.start/60)).padStart(2,'0')+':'+String(Math.floor(c.start%60)).padStart(2,'0')+' '+c.title;b.onclick=()=>{video.currentTime=c.start;video.scrollIntoView({block:'center',behavior:'smooth'});video.play().catch(()=>{status.textContent='已定位章节，点击播放即可。'});};document.getElementById('chapters').append(b);}}).catch(()=>{status.textContent='章节暂时不可用，请通过视频进度条观看。'});
video.addEventListener('error',()=>{status.textContent='视频尚未就绪或无法读取，请确认交付包包含 web/media 文件。'});
</script>
