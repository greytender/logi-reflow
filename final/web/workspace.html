<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中央仓调度工作台 · 城配续航</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="spatial3d.css"><link rel="stylesheet" href="central.css"><script src="scene.js" defer></script><script src="spatial3d.js" defer></script><script src="central.js" defer></script><script src="central-operations.js" defer></script></head>

<div class="layout"><aside class="sidebar"><div class="sidebar-head"><h2>配送任务</h2><a class="icon" href="intake.html" aria-label="导入订单" data-icon="plus"></a></div><div id="batch-list" class="tasks"></div><nav class="stage-nav" aria-label="批次操作"><button data-tab="overview" class="active">调度总览</button><button data-tab="orders">订单核对</button><button data-tab="routes">配车排线</button><button data-tab="warehouse">3D 装卸</button><button data-tab="recovery">回收返仓</button></nav><a class="sidebar-import" href="intake.html">导入与核对 Excel ↗</a><footer class="profile"><span class="avatar" data-icon="user"></span><div><strong>调度员</strong><small>中央仓 · 本机工作区</small></div></footer></aside>
<main id="content" class="workspace"><div class="workspace-head"><div><h1 id="batch-title">正在读取中央仓批次…</h1><p id="batch-meta"></p></div><div class="toolbar"><button id="delivery-settings" class="quiet-button">配送设置</button><button id="refresh" class="quiet-button">刷新</button><button id="solve" class="primary">重新排车</button></div></div><div id="notice" role="status" hidden></div>
