<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随车看配送 · 城配续航</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/rounded-theme.css"><link rel="stylesheet" href="/spatial3d.css"><link rel="stylesheet" href="/driving3d.css"><link rel="stylesheet" href="/journey.css"><script src="/route-map3d.js" defer></script><script src="/driving3d.js" defer></script><script src="/spatial3d.js" defer></script><script src="/journey.js" defer></script></head>
<body class="journey-page"><header class="journey-header"><a class="journey-brand" href="/"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#527e63"/><path d="m9 13 9-5 9 5v10l-9 5-9-5V13Zm0 0 9 5 9-5m-9 5v10" stroke="#f1f5e9" fill="none" stroke-width="1.5"/></svg>城配续航</a><a id="journeyBack" href="/workspace.html">返回配送工作台</a></header>
<main><div class="journey-intro"><div><h1>随车看配送</h1><p id="journeyContext">正在读取路线</p></div><a id="journeyCargoLink" href="/spatial.html" hidden>车厢细看</a></div><div id="journeyError" class="journey-empty" role="status" hidden></div>
<section id="journeyPlayer" class="journey-player" aria-label="配送全流程" hidden><div class="journey-toolbar"><div><strong id="journeyStageTitle">仓库装车</strong><span id="journeyStageDetail"></span></div><div class="journey-views" role="group" aria-label="配送视角"><button data-journey-view="auto" aria-pressed="true">跟随流程</button><button data-journey-view="driver" aria-pressed="false">驾驶视角</button><button data-journey-view="chase" aria-pressed="false">跟车视角</button><button data-journey-view="overview" aria-pressed="false">路线全景</button><button data-journey-view="cargo" aria-pressed="false">看装卸</button></div></div>
<div class="journey-stage" id="journeyStage" data-surface="driving"><div id="journeyDriving" class="journey-surface" aria-label="车辆道路行驶"></div><div id="journeyCargo" class="journey-surface" aria-label="门店装卸过程"></div><div class="journey-switch-note" id="journeySwitchNote" aria-live="polite"></div></div>
<div class="journey-transport"><div class="journey-buttons"><button id="journeyPrevious" aria-label="上一步"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m13-14L8 12l11 7Z"/></svg></button><button id="journeyPlay" class="journey-play" aria-label="播放配送过程"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg></button><button id="journeyNext" aria-label="下一步"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7L5 19Z"/></svg></button><button id="journeyRestart">重播</button></div><p id="journeyProgressText">播放进度</p><label class="journey-speed">播放速度<select id="journeySpeed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<input id="journeyTimeline" class="journey-timeline" type="range" min="0" max="1" value="0" step="0.01" aria-label="配送播放进度"><nav id="journeyStations" class="journey-stations" aria-label="配送站点"></nav></section></main></body></html>
