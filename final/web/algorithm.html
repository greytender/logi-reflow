 function routeAround(p,q,sides,original,source,target){const unrelated=[...byId.values()].filter(n=>n.id!==source&&n.id!==target);if(original.slice(1).every((v,i)=>!unrelated.some(n=>intersects(original[i],v,n))))return original;

 const nodes=[...byId.values()].map((n,i)=>{const t=themes[n.tone]||themes.green;const x=n.x-n.w/2,y=n.y-n.h/2;let shape='';const style=`fill="${t.fill}" stroke="${t.stroke}" stroke-width="1.2"`;

document.addEventListener('click',event=>{const b=event.target.closest('[data-export]');if(!b)return;const i=Number(b.dataset.export);const svg=document.querySelector('#'+graphs[i].id+' svg').cloneNode(true);const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=`text{font-family:'Microsoft YaHei',sans-serif}.node-label{fill:#24473a;font-size:13px}.node-sub{fill:#516e60;font-size:11px}.edge-label{fill:#4a6958;font-size:11px;paint-order:stroke;stroke:#fff;stroke-width:5px}.lane-label{fill:#506b59;font-size:12px;font-weight:600}.node-code{fill:#66846e;font-size:10px}.edge{fill:none;stroke:#819a87;stroke-width:1.5;stroke-linejoin:round}.no{stroke:#b07e59}.feedback{stroke:#8b7ca2;stroke-dasharray:5 4}.api{stroke:#a88d5d;stroke-dasharray:6 4}`;svg.prepend(style);const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=String(i+1).padStart(2,'0')+'-'+graphs[i].title.replace(/[\/:*?"<>|]/g,'')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);});
let activeIndex=0,presenting=false;
function showGraph(){document.querySelectorAll('.diagram-section').forEach((s,i)=>s.classList.toggle('present-active',i===activeIndex));document.getElementById('present-page').textContent=`${activeIndex+1} / ${graphs.length}`;document.getElementById('previous-graph').disabled=activeIndex===0;document.getElementById('next-graph').disabled=activeIndex===graphs.length-1;}
function setPresentation(value){presenting=value;document.body.classList.toggle('presenting',value);document.getElementById('present-controls').hidden=!value;showGraph();if(value)window.scrollTo(0,0);else document.getElementById(graphs[activeIndex].id).scrollIntoView();}
document.getElementById('presentation').onclick=()=>{const id=location.hash.slice(1);const found=graphs.findIndex(g=>g.id===id);if(found>=0)activeIndex=found;setPresentation(!presenting);};document.getElementById('exit-presentation').onclick=()=>setPresentation(false);document.getElementById('previous-graph').onclick=()=>{activeIndex=Math.max(0,activeIndex-1);showGraph();};document.getElementById('next-graph').onclick=()=>{activeIndex=Math.min(graphs.length-1,activeIndex+1);showGraph();};document.getElementById('print').onclick=()=>window.print();
