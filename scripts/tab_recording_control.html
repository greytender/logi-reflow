<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城配续航｜后台标签页录制控制</title>
<style>body{font:18px/1.8 system-ui,"Microsoft YaHei",sans-serif;background:#f6f7f2;color:#182f25;max-width:780px;margin:60px auto;padding:24px}button{font:inherit;padding:12px 22px;border:1px solid #245440;border-radius:10px;background:#245440;color:white;cursor:pointer}button:disabled{opacity:.4}a{color:#245440}#status{white-space:pre-wrap}</style>
<h1>只录城配续航标签页</h1>
<p>点击下方按钮，在浏览器的共享选择框中选择<strong>城配续航演示标签页（127.0.0.1:18778）</strong>。选择后可以切回其他窗口工作，无需把演示页留在前台。</p>
<p>请选择浏览器标签页；选择桌面或窗口会被拒绝。本页不会录音，不读取麦克风，不录其他应用。最终旁白和字幕将在视频制作时加入。</p>
<button id="start">选择演示标签页，开始录制</button> <button id="stop" disabled>停止并保存原始录像</button>
<p id="status" role="status">尚未开始。请保持本控制页和被录制的演示标签页打开。</p>
<script>
window.captureControl={state:'idle',chunks:[],settings:null,recordedBlob:null};
const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');
start.onclick=async()=>{const s=window.captureControl;start.disabled=true;try{
 const controller=typeof CaptureController==='function'?new CaptureController():null;
 const options={video:{displaySurface:'browser',frameRate:{ideal:25,max:30}},audio:false,systemAudio:'exclude',monitorTypeSurfaces:'exclude',selfBrowserSurface:'exclude',surfaceSwitching:'exclude'};
 if(controller){controller.setFocusBehavior('focus-capturing-application');options.controller=controller;}
 const stream=await navigator.mediaDevices.getDisplayMedia(options);
 const settings=stream.getVideoTracks()[0].getSettings();
 if(settings.displaySurface!=='browser'){stream.getTracks().forEach(t=>t.stop());throw Error('请选择浏览器标签页；窗口或桌面没有开始录制。');}
 const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
 const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
 s.stream=stream;s.recorder=recorder;s.settings=settings;s.chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)s.chunks.push(e.data);};
 recorder.onstop=()=>{s.recordedBlob=new Blob(s.chunks,{type:mime});s.state='saved';stream.getTracks().forEach(t=>t.stop());const a=document.createElement('a');a.href=URL.createObjectURL(s.recordedBlob);a.download='logireflow-continuous-tab-recording.webm';a.textContent='下载原始连续录像';document.body.append(a);a.click();status.textContent='录制已结束，原始录像已准备下载。';stop.disabled=true;};
 stream.getVideoTracks()[0].onended=()=>{if(recorder.state!=='inactive')recorder.stop();};
 recorder.start(1000);s.state='recording';s.startedAt=Date.now();stop.disabled=false;
 status.textContent='正在录指定标签页。现在可以回到其他窗口工作。请勿关闭这两个标签页或点击浏览器的停止共享。';
 }catch(e){s.state='error';s.error=String(e);status.textContent=s.error;start.disabled=false;}};
stop.onclick=()=>{const s=window.captureControl;if(s.recorder?.state!=='inactive')s.recorder.stop();};
</script></html>
